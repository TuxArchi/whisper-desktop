[workspace]
resolver = "2"
members = ["crates/wd-core", "crates/wd-cli"]
# The Tauri shell needs system webkit/gtk libraries; keeping it out of the
# workspace means `cargo test --workspace` works on any machine.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Whisper Desktop contributors"]
repository = "https://github.com/TuxArchi/whisper-desktop"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

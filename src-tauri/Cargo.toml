[package]
name = "whisper-desktop"
description = "Whisper Desktop application shell"
version = "0.1.4"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["Whisper Desktop contributors"]

# Detached from the root workspace on purpose: building Tauri needs
# webkit2gtk-4.1, and the core test suite must run anywhere.
[workspace]

[lib]
name = "whisper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
wd-core = { path = "../crates/wd-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

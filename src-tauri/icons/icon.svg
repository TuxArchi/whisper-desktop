<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Whisper Desktop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121a26"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f6fe0"/>
      <stop offset="55%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#8ab4ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#4f8ef7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#4f8ef7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#2a3240" stroke-width="3"/>

  <!-- waveform -->
  <g fill="url(#bars)">
    <rect x="104" y="222" width="30" height="68" rx="15"/>
    <rect x="158" y="184" width="30" height="144" rx="15"/>
    <rect x="212" y="140" width="30" height="232" rx="15"/>
    <rect x="266" y="170" width="30" height="172" rx="15"/>
    <rect x="320" y="198" width="30" height="116" rx="15"/>
    <rect x="374" y="228" width="30" height="56" rx="15"/>
  </g>

  <!-- baseline accent -->
  <rect x="104" y="330" width="300" height="6" rx="3" fill="#4f8ef7" opacity="0.35" filter="url(#soft)"/>
</svg>

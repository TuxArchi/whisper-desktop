<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Whisper Desktop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#101722"/>
      <stop offset="100%" stop-color="#0b1016"/>
    </linearGradient>
    <radialGradient id="halo" cx="20%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#4f8ef7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4f8ef7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f6fe0"/>
      <stop offset="55%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#8ab4ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8ef7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4f8ef7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#halo)"/>

  <g stroke="#1c2533" stroke-width="1" opacity="0.5">
    <path d="M0 160h1280M0 320h1280M0 480h1280"/>
    <path d="M160 0v640M320 0v640M480 0v640M640 0v640M800 0v640M960 0v640M1120 0v640"/>
  </g>

  <!-- icon mark -->
  <g transform="translate(96, 132)">
    <rect width="116" height="116" rx="26" fill="#121a26" stroke="#2a3240" stroke-width="2"/>
    <g fill="url(#bars)" transform="scale(0.227)">
      <rect x="104" y="222" width="30" height="68" rx="15"/>
      <rect x="158" y="184" width="30" height="144" rx="15"/>
      <rect x="212" y="140" width="30" height="232" rx="15"/>
      <rect x="266" y="170" width="30" height="172" rx="15"/>
      <rect x="320" y="198" width="30" height="116" rx="15"/>
      <rect x="374" y="228" width="30" height="56" rx="15"/>
    </g>
  </g>

  <text x="238" y="186" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="25" font-weight="600"
        fill="#8b98a9" letter-spacing="4">WHISPER DESKTOP</text>
  <text x="238" y="218" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="19" font-weight="400"
        fill="#5f6c7d">Whisper en tu escritorio, sin dependencias</text>

  <text x="96" y="330" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="54" font-weight="700"
        fill="#e6edf3" letter-spacing="-1.2">Transcribe y traduce</text>
  <text x="96" y="396" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="54" font-weight="700"
        fill="#e6edf3" letter-spacing="-1.2">en tu propio equipo.</text>

  <rect x="96" y="428" width="380" height="3" fill="url(#rule)"/>

  <text x="96" y="482" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="23" font-weight="400"
        fill="#8b98a9">Sin Python. Sin CUDA a mano. Todo local.</text>

  <g font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="20" font-weight="500" fill="#c3ccd8">
    <rect x="96" y="530" width="140" height="44" rx="22" fill="#151c26" stroke="#2a3240" stroke-width="1.5"/>
    <text x="166" y="559" text-anchor="middle">Windows</text>

    <rect x="252" y="530" width="112" height="44" rx="22" fill="#151c26" stroke="#2a3240" stroke-width="1.5"/>
    <text x="308" y="559" text-anchor="middle">Linux</text>

    <rect x="380" y="530" width="182" height="44" rx="22" fill="#12202c" stroke="#1f3a52" stroke-width="1.5"/>
    <text x="471" y="559" text-anchor="middle" fill="#7fb3f0">100 % offline</text>
  </g>

  <!-- right side: GPU tiers -->
  <g transform="translate(776, 136)">
    <rect width="408" height="368" rx="22" fill="#111823" stroke="#222c3a" stroke-width="1.5"/>
    <text x="30" y="48" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="18" font-weight="600"
          fill="#6d7b8d" letter-spacing="2.5">ELIGE SOLO</text>

    <g font-family="Noto Sans, DejaVu Sans, sans-serif">
      <circle cx="42" cy="100" r="8" fill="#76b900"/>
      <text x="66" y="108" font-size="23" font-weight="600" fill="#e6edf3">NVIDIA</text>
      <text x="66" y="134" font-size="18" fill="#8b98a9">CUDA</text>

      <circle cx="42" cy="186" r="8" fill="#ed1c24"/>
      <text x="66" y="194" font-size="23" font-weight="600" fill="#e6edf3">AMD</text>
      <text x="66" y="220" font-size="18" fill="#8b98a9">Vulkan · ROCm</text>

      <circle cx="42" cy="272" r="8" fill="#4f8ef7"/>
      <text x="66" y="280" font-size="23" font-weight="600" fill="#e6edf3">Intel</text>
      <text x="66" y="306" font-size="18" fill="#8b98a9">Vulkan</text>
    </g>

    <rect x="30" y="330" width="348" height="1" fill="#222c3a"/>
  </g>
</svg>

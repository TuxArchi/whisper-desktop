name: Backends

# Builds the whisper.cpp backends, hashes them, generates the signed
# catalogue and publishes the release. Independent from app releases: bumping
# whisper.cpp never requires shipping a new application version.

on:
  workflow_dispatch:
    inputs:
      whisper_version:
        description: "Versión de whisper.cpp (tag sin la v)"
        required: true
        default: "1.8.4"
      channel:
        description: "Canal del catálogo"
        required: true
        default: "stable"
        type: choice
        options: [stable, beta]
      release_tag:
        description: "Tag del release de backends"
        required: true
        default: "backends-r1"
  push:
    tags:
      - "backends-*"

permissions:
  contents: write

env:
  WHISPER_VERSION: ${{ github.event.inputs.whisper_version || '1.8.4' }}
  # On workflow_dispatch github.ref_name is the branch ("main"), which would
  # create a release called "main".
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
  WHISPER_REPO: https://github.com/ggml-org/whisper.cpp
  # BtbN rotates and deletes autobuild tags, so a pinned one eventually 404s.
  # The version is recorded in the release notes.
  FFMPEG_TAG: latest

jobs:
  linux:
    name: linux-${{ matrix.backend }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan]
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libvulkan-dev

      # Ubuntu 22.04 has no glslc package; the SDK provides it.
      - name: Vulkan SDK
        if: matrix.backend == 'vulkan'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.363.0
          install_runtime: false
          cache: true
          stripdown: false

      - name: Fetch whisper.cpp
        run: |
          git clone --depth 1 --branch "v${WHISPER_VERSION}" "$WHISPER_REPO" whisper.cpp

      - name: Build
        working-directory: whisper.cpp
        run: bash ../scripts/build-backend.sh "${{ matrix.backend }}" "$WHISPER_VERSION" ../release

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.backend }}
          path: release/*.tar.gz
          if-no-files-found: error

  # CUDA on Linux needs the toolkit; kept separate so it can be triggered
  # alone when only the CUDA build changes.
  linux-cuda:
    name: linux-cuda
    # Builds take ~30 minutes and NVIDIA users fall back to Vulkan through
    # fit_plan_to_catalog. Re-enable when the CUDA stubs are sorted out.
    if: false
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.6.2-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y cmake build-essential git

      - name: Fetch whisper.cpp
        run: git clone --depth 1 --branch "v${WHISPER_VERSION}" "$WHISPER_REPO" whisper.cpp

      - name: Build
        working-directory: whisper.cpp
        run: |
          # The devel image has the driver stub but does not link against it.
          export LIBRARY_PATH="/usr/local/cuda/lib64/stubs:${LIBRARY_PATH:-}"
          bash ../scripts/build-backend.sh cuda "$WHISPER_VERSION" ../release

      - uses: actions/upload-artifact@v4
        with:
          name: linux-cuda
          path: release/*.tar.gz
          if-no-files-found: error

  windows:
    name: windows-${{ matrix.backend }}
    # Windows is deferred: these jobs have never run and would only slow the
    # Linux pipeline. Re-enable when the Windows port is tested.
    if: false
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan, cuda]
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan SDK
        if: matrix.backend == 'vulkan'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.363.0
          install_runtime: false
          cache: true
          stripdown: false

      - name: Fetch whisper.cpp
        run: git clone --depth 1 --branch "v$env:WHISPER_VERSION" "$env:WHISPER_REPO" whisper.cpp
        shell: pwsh

      - name: Build
        working-directory: whisper.cpp
        shell: pwsh
        run: ./../scripts/build-backend.ps1 -Backend ${{ matrix.backend }} -Version $env:WHISPER_VERSION -Out ../release

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.backend }}
          path: release/*.zip
          if-no-files-found: error

  # ffmpeg is repacked so the app only ships the binary, never the whole tree.
  ffmpeg:
    name: ffmpeg-lgpl
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download and repack
        run: |
          set -euo pipefail
          base="https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_TAG}"
          mkdir -p release work

          curl -fL "$base/ffmpeg-master-latest-win64-lgpl.zip" -o work/win.zip
          unzip -q work/win.zip -d work/win
          mkdir -p work/stage-win/bin
          find work/win -name ffmpeg.exe -exec cp {} work/stage-win/bin/ffmpeg.exe \;
          (cd work/stage-win && zip -qr ../../release/ffmpeg-lgpl-win64.zip .)
          cp work/win/LICENSE.txt release/LICENSE.ffmpeg.txt 2>/dev/null || true

          curl -fL "$base/ffmpeg-master-latest-linux64-lgpl.tar.xz" -o work/linux.tar.xz
          tar -xJf work/linux.tar.xz -C work --one-top-level=linux
          mkdir -p work/stage-linux/bin
          find work/linux -name ffmpeg -type f -exec cp {} work/stage-linux/bin/ffmpeg \;
          chmod +x work/stage-linux/bin/ffmpeg
          tar -C work/stage-linux -czf release/ffmpeg-lgpl-linux64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg
          path: release/ffmpeg-*.*

  catalog:
    name: catalog + release
    runs-on: ubuntu-22.04
    needs: [linux, linux-cuda, windows, ffmpeg]
    # A skipped job in `needs` skips the dependent one; the catalogue must run
    # as long as the Linux build and ffmpeg succeeded, even if the optional
    # platforms were disabled or failed.
    if: always() && needs.linux.result == 'success' && needs.ffmpeg.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Hash and generate catalogue
        run: |
          node scripts/make-catalog.mjs \
            --artifacts release \
            --manifest scripts/backends.manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --release "$RELEASE_TAG" \
            --models scripts/models.json \
            --allow-missing \
            --channel "${{ github.event.inputs.channel || 'stable' }}" \
            --out release/catalog.json

      - name: Sign catalogue (Ed25519)
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          # Public: must match crates/wd-core/src/trust.rs
          CATALOG_PUBLIC_KEY: yTr7vAs25nvtFhPwfGeaoLXcezMl+eqNoSMASXvm6cE=
        run: |
          set -euo pipefail
          printf '%s' "$CATALOG_SIGNING_KEY" | base64 -d > /tmp/catalog.key
          node scripts/trust.mjs sign --key /tmp/catalog.key \
            --in release/catalog.json --out release/catalog.json.sig
          rm -f /tmp/catalog.key
          node scripts/trust.mjs verify --pub "$CATALOG_PUBLIC_KEY" \
            --in release/catalog.json --sig release/catalog.json.sig

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$RELEASE_TAG" --yes 2>/dev/null || true
          gh release create "$RELEASE_TAG" release/* release/catalog.json.sig \
            --title "Backends $RELEASE_TAG" \
            --notes "whisper.cpp ${WHISPER_VERSION} · ffmpeg ${FFMPEG_TAG} · canal ${{ github.event.inputs.channel || 'stable' }}"

      # The app reads this URL first; keep it in sync with the release.
      - name: Publish catalogue for the app
        run: |
          set -euo pipefail
          cp release/catalog.json docs/catalog.json
          cp release/catalog.json.sig docs/catalog.json.sig
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalog.json docs/catalog.json.sig
          git diff --cached --quiet || git commit -m "chore: catálogo firmado desde $RELEASE_TAG"
          git push
